[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antibody-repertoire"
version = "0.1.0"
description = "Clonal lineage analysis of antibody repertoire sequencing data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "networkx>=3.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
antibody-repertoire = "antibody_repertoire.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/antibody_repertoire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: tests that run the quadratic reference implementation",
]
